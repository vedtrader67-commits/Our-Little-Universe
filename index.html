<style>

:root {
  --bg: #070b16;
  --panel: #0e1527;
  --panel-2: #121c31;
  --line: #243252;
  --text: #f6f8ff;
  --muted: #96a3bf;
  --brand: #4f8cff;
  --brand-2: #7b61ff;
  --good: #34d399;
  --warn: #fbbf24;
  --bad: #fb7185;
  --radius: 18px;
  --shadow: 0 18px 50px rgba(0,0,0,.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg,#050812 0%,#0a1020 50%,#070b16 100%);
  color: var(--text);
  font-family: Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
button,input,select,textarea { font: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
.hidden { display: none !important; }
.app-shell { width: 100%; min-height: 100vh; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  backdrop-filter: blur(16px);
  background: rgba(5,8,18,.86);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.topbar-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 10px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
}
.brand {
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 800;
  letter-spacing: -.03em;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow: 0 8px 28px rgba(79,140,255,.32);
}
.search-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
  background: #0b1325;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 8px;
}
.search-wrap input {
  width: 100%;
  border: 0;
  outline: 0;
  color: var(--text);
  background: transparent;
  padding: 9px;
}
.icon-btn,.pill-btn,.primary-btn,.ghost-btn,.danger-btn {
  border: 0;
  border-radius: 12px;
  color: var(--text);
  background: #141e34;
  min-height: 42px;
  padding: 10px 14px;
}
.primary-btn {
  background: linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow: 0 10px 26px rgba(79,140,255,.22);
}
.ghost-btn { border: 1px solid var(--line); background: transparent; }
.danger-btn { background: rgba(251,113,133,.14); color: #fecdd3; border: 1px solid rgba(251,113,133,.2); }
.cart-badge { position: relative; }
.cart-badge span {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--bad);
  color: #fff;
  font-size: 10px;
  line-height: 18px;
  min-width: 18px;
  height: 18px;
  border-radius: 99px;
  text-align: center;
}
.main { max-width: 1280px; margin: 0 auto; padding: 18px 14px 90px; }
.hero {
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px;
  min-height: 190px;
  display: grid;
  gap: 12px;
  align-items: end;
  background:
    radial-gradient(circle at 80% 20%,rgba(123,97,255,.34),transparent 28%),
    radial-gradient(circle at 20% 70%,rgba(79,140,255,.22),transparent 32%),
    linear-gradient(135deg,#101a31,#0c1324);
  box-shadow: var(--shadow);
}
.hero h1 { margin: 0; font-size: clamp(28px,6vw,52px); line-height: .98; }
.hero p { color: var(--muted); margin: 0; max-width: 700px; }
.section { margin-top: 22px; }
.section-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: 20px; }
.horizontal-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.horizontal-scroll::-webkit-scrollbar { display: none; }
.category {
  min-width: 112px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 16px;
  padding: 12px;
  text-align: center;
}
.category strong { display: block; margin-top: 6px; font-size: 12px; }
.product-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 12px;
}
.card {
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  background: linear-gradient(180deg,#0f172a,#0d1424);
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
}
.product-image {
  aspect-ratio: 1;
  background: #10182c;
  object-fit: cover;
  width: 100%;
}
.card-body { padding: 12px; }
.card-title { font-weight: 700; font-size: 14px; line-height: 1.25; min-height: 36px; }
.price-line { display: flex; gap: 8px; align-items: center; margin-top: 7px; }
.price { font-weight: 800; }
.mrp { color: var(--muted); text-decoration: line-through; font-size: 12px; }
.discount { color: var(--good); font-size: 11px; font-weight: 700; }
.rating { color: #fde68a; font-size: 12px; }
.card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.empty {
  border: 1px dashed var(--line);
  border-radius: 16px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}
.drawer,.modal {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0,0,0,.6);
  display: grid;
  align-items: end;
}
.drawer-panel,.modal-panel {
  background: #0a1120;
  border: 1px solid var(--line);
  border-radius: 24px 24px 0 0;
  max-height: 92vh;
  overflow: auto;
  box-shadow: 0 -20px 70px rgba(0,0,0,.4);
}
.modal { align-items: center; padding: 14px; }
.modal-panel { border-radius: 22px; width: min(760px,100%); max-height: 92vh; }
.panel-pad { padding: 16px; }
.close-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.detail-grid { display: grid; gap: 16px; }
.detail-grid img { border-radius: 18px; width: 100%; max-height: 420px; object-fit: cover; }
.info-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.info-item { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--panel); }
.info-item small { color: var(--muted); display: block; }
.form-grid { display: grid; gap: 10px; }
.field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 5px; }
.field input,.field textarea,.field select {
  width: 100%;
  border: 1px solid var(--line);
  background: #0d1628;
  color: var(--text);
  border-radius: 12px;
  padding: 11px 12px;
  outline: 0;
}
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 60;
  background: rgba(5,8,18,.92);
  border-top: 1px solid rgba(255,255,255,.07);
  backdrop-filter: blur(16px);
}
.nav-inner { max-width: 700px; margin: 0 auto; display: grid; grid-template-columns: repeat(5,1fr); }
.nav button { border: 0; background: transparent; color: var(--muted); padding: 9px 4px 11px; }
.nav button.active { color: #fff; }
.nav small { display: block; font-size: 10px; margin-top: 3px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 76px;
  transform: translateX(-50%);
  z-index: 120;
  background: #eef2ff;
  color: #111827;
  border-radius: 12px;
  padding: 11px 14px;
  display: none;
  box-shadow: var(--shadow);
  max-width: calc(100% - 24px);
}
.toast.show { display: block; }
.badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: 99px;
  font-size: 11px;
  border: 1px solid var(--line);
  background: #10182d;
}
.status { border-radius: 12px; padding: 9px 10px; background: #0f1728; border: 1px solid var(--line); color: var(--muted); }
.status.ok { color: #bbf7d0; border-color: rgba(52,211,153,.25); }
.status.error { color: #fecaca; border-color: rgba(251,113,133,.25); }
.order-card { border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: var(--panel); margin-bottom: 10px; }
.order-top { display:flex; justify-content:space-between; gap:10px; }
hr.sep { border:0; border-top:1px solid var(--line); margin: 14px 0; }
.muted { color: var(--muted); }
.row { display:flex; gap:8px; align-items:center; }
.space { justify-content:space-between; }
.stack { display:grid; gap:8px; }
.w-100 { width:100%; }
@media (min-width: 760px) {
  .product-grid { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .detail-grid { grid-template-columns: 1.05fr .95fr; }
  .drawer { align-items: stretch; justify-items:end; }
  .drawer-panel { width: min(460px,100%); border-radius: 24px 0 0 24px; max-height: 100vh; }
}

/* ===== SHOPNOVA 2026 EXPERIENCE LAYER ===== */
:root { --glow: rgba(79,140,255,.32); --glass: rgba(14,21,39,.72); --ease: cubic-bezier(.2,.8,.2,1); }
body { overflow-x:hidden; }
body::before { content:""; position:fixed; inset:-20%; pointer-events:none; z-index:-1; background:radial-gradient(circle at 15% 15%,rgba(79,140,255,.08),transparent 28%),radial-gradient(circle at 85% 30%,rgba(123,97,255,.08),transparent 30%); animation:ambient 18s ease-in-out infinite alternate; }
@keyframes ambient { from { transform:scale(1) rotate(0deg); } to { transform:scale(1.08) rotate(2deg); } }
button,.card,.category,.icon-btn,.primary-btn,.ghost-btn,.danger-btn { transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease); }
button:active { transform:scale(.97); }
@media (hover:hover) { .card:hover { transform:translateY(-4px); box-shadow:0 18px 42px rgba(0,0,0,.28),0 0 0 1px rgba(79,140,255,.08); } .category:hover { transform:translateY(-2px); border-color:rgba(79,140,255,.5); } }
.skeleton { position:relative; overflow:hidden; background:#111a2e; border-radius:12px; }
.skeleton::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent); animation:shimmer 1.2s infinite; }
@keyframes shimmer { to { transform:translateX(100%); } }
.product-grid.compact { grid-template-columns:repeat(2,minmax(0,1fr)); }
.feature-strip { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px; }
.feature-tile { border:1px solid var(--line); border-radius:16px; padding:14px; background:linear-gradient(145deg,rgba(255,255,255,.035),rgba(255,255,255,.015)); }
.feature-tile b { display:block; margin-bottom:4px; }
.toolbar { display:flex; gap:8px; overflow:auto; padding:4px 0 8px; scrollbar-width:none; }
.toolbar::-webkit-scrollbar { display:none; }
.chip { white-space:nowrap; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:99px; padding:8px 12px; }
.chip.active { border-color:rgba(79,140,255,.7); background:rgba(79,140,255,.14); }
.flash-sale { border:1px solid rgba(251,191,36,.22); background:linear-gradient(120deg,rgba(251,191,36,.09),rgba(251,113,133,.06)); border-radius:18px; padding:14px; }
.flash-sale strong { color:#fde68a; }
.countdown { font-variant-numeric:tabular-nums; font-weight:800; letter-spacing:.04em; }
.quick-actions { position:fixed; right:14px; bottom:82px; z-index:55; display:grid; gap:8px; }
.quick-fab { width:48px; height:48px; border-radius:50%; border:1px solid var(--line); background:rgba(12,19,36,.9); color:#fff; box-shadow:0 12px 30px rgba(0,0,0,.3); backdrop-filter:blur(12px); }
.compare-bar { position:fixed; left:12px; right:12px; bottom:72px; z-index:58; padding:10px; border:1px solid var(--line); background:rgba(10,17,32,.94); backdrop-filter:blur(16px); border-radius:16px; box-shadow:0 18px 45px rgba(0,0,0,.35); }
.toast-stack { position:fixed; right:12px; top:70px; z-index:130; display:grid; gap:8px; max-width:min(360px,calc(100% - 24px)); }
.toast-item { padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:rgba(14,21,39,.96); box-shadow:var(--shadow); animation:toastIn .25s var(--ease); }
@keyframes toastIn { from { opacity:0; transform:translateY(-8px) scale(.98); } to { opacity:1; transform:none; } }
.product-card-badge { position:absolute; top:9px; left:9px; z-index:2; }
.image-wrap { position:relative; overflow:hidden; }
.image-wrap img { transition:transform .45s var(--ease); }
@media (hover:hover) { .card:hover .image-wrap img { transform:scale(1.045); } }
.price-progress { height:5px; border-radius:99px; background:#17213a; overflow:hidden; margin-top:8px; }
.price-progress i { display:block; height:100%; width:65%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); border-radius:inherit; }
.compare-table { width:100%; border-collapse:collapse; font-size:12px; }
.compare-table th,.compare-table td { border-bottom:1px solid var(--line); padding:10px 7px; text-align:left; vertical-align:top; }
.compare-table th { color:var(--muted); }
.no-select { user-select:none; }
@media (min-width:760px) { .feature-strip { grid-template-columns:repeat(4,1fr); } .product-grid.compact { grid-template-columns:repeat(4,minmax(0,1fr)); } .quick-actions { right:24px; bottom:92px; } }
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; transition-duration:.01ms !important; } }

/* ===== SHOPNOVA FEATURE PACK: reviews, coupons, tracking, filters, admin, addresses ===== */
.star-input { display:flex; gap:4px; font-size:26px; cursor:pointer; user-select:none; }
.star-input span { color:#374357; }
.star-input span.on { color:#fde68a; }
.review-item { border-bottom:1px solid var(--line); padding:10px 0; }
.review-item:last-child { border-bottom:0; }
.review-stars { color:#fde68a; font-size:13px; }
.rating-breakdown { display:grid; grid-template-columns:auto 1fr auto; gap:6px 10px; align-items:center; font-size:12px; margin:8px 0; }
.rating-bar { height:7px; border-radius:99px; background:#17213a; overflow:hidden; }
.rating-bar i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand-2)); }
.filter-toolbar { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; align-items:center; }
.filter-toolbar::-webkit-scrollbar { display:none; }
.filter-toolbar select { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:99px; padding:8px 10px; }
.filter-toolbar input[type="number"] { width:74px; border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:99px; padding:8px 10px; }
.timeline { display:grid; gap:0; margin-top:10px; }
.timeline-step { display:grid; grid-template-columns:22px 1fr; gap:10px; position:relative; padding-bottom:20px; }
.timeline-step:last-child { padding-bottom:0; }
.timeline-dot { width:14px; height:14px; border-radius:50%; background:#20304f; margin-top:3px; position:relative; z-index:1; }
.timeline-step.done .timeline-dot { background:var(--good); }
.timeline-step.current .timeline-dot { background:var(--brand); box-shadow:0 0 0 4px rgba(79,140,255,.22); }
.timeline-step:not(:last-child)::before { content:""; position:absolute; left:6px; top:16px; bottom:0; width:2px; background:var(--line); }
.timeline-step.done:not(:last-child)::before { background:var(--good); }
.timeline-label { font-weight:700; font-size:13px; }
.timeline-label small { display:block; font-weight:400; color:var(--muted); }
.admin-table { width:100%; border-collapse:collapse; font-size:12px; }
.admin-table th,.admin-table td { border-bottom:1px solid var(--line); padding:9px 6px; text-align:left; vertical-align:middle; }
.admin-table img { width:38px; height:38px; border-radius:8px; object-fit:cover; }
.admin-tabs { display:flex; gap:8px; margin:12px 0; }
.admin-tabs button.active { border-color:rgba(79,140,255,.7); background:rgba(79,140,255,.14); }
.addr-card { border:1px solid var(--line); border-radius:14px; padding:12px; background:var(--panel); margin-bottom:8px; }
.addr-card.default { border-color:rgba(52,211,153,.4); }
.coupon-row { display:flex; gap:8px; }
.coupon-row input { flex:1; }
.discount-line { color:var(--good); }
</style>
</head>
<body>
<div id="app" class="app-shell">
<header class="topbar">
<div class="topbar-inner">
<a class="brand" href="#" onclick="UI.go('home');return false;">
<div class="brand-mark">S</div>
<div>ShopNova</div>
</a>
<div class="search-wrap">
<input id="searchInput" type="search" placeholder="Search products, brands and categories" autocomplete="off">
<button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
</div>
<button class="icon-btn cart-badge" id="cartBtn" aria-label="Cart">🛒<span id="cartCount">0</span></button>
</div>
</header>
<main class="main">
<section id="homeView">
<div class="hero">
<div class="badge">Trusted marketplace</div>
<h1>Everything you need.<br>One smooth checkout.</h1>
<p>Shop products, save favourites, manage orders and keep your account synced securely with Firebase.</p>
<div class="row">
<button class="primary-btn" onclick="UI.scrollToProducts()">Shop now</button>
<button class="ghost-btn" onclick="UI.openAccount()">My account</button>
</div>
</div>
<div class="section">
<div class="section-head"><h2>Categories</h2><span class="muted">Browse</span></div>
<div id="categories" class="horizontal-scroll"></div>
</div>
<div class="section">
<div class="section-head"><h2>Trending products</h2><span id="productMeta" class="muted"></span></div>
<div id="homeFilterToolbar" class="filter-toolbar"></div>
<div id="products" class="product-grid"></div>
</div>
</section>
<section id="searchView" class="hidden">
<div class="section-head"><h2>Search results</h2><button class="ghost-btn" onclick="UI.go('home')">Back</button></div>
<div id="searchFilterToolbar" class="filter-toolbar"></div>
<div id="searchResults" class="product-grid"></div>
</section>
<section id="ordersView" class="hidden">
<div class="section-head"><h2>My orders</h2><button class="ghost-btn" onclick="UI.go('home')">Shop</button></div>
<div id="ordersList"></div>
</section>
<section id="wishlistView" class="hidden">
<div class="section-head"><h2>Wishlist</h2><button class="ghost-btn" onclick="UI.go('home')">Shop</button></div>
<div id="wishlistList" class="product-grid"></div>
</section>
<section id="accountView" class="hidden">
<div class="section-head"><h2>Account</h2><button class="ghost-btn" onclick="UI.go('home')">Home</button></div>
<div id="accountPanel"></div>
</section>
</main>

<section id="experienceView" class="hidden">
  <div class="section-head"><h2>Discover</h2><button class="ghost-btn" onclick="UI.go('home')">Home</button></div>
  <div id="discoverContent"></div>
</section>
<section id="adminView" class="hidden" style="max-width:1280px;margin:0 auto;padding:18px 14px 90px">
  <div class="section-head"><h2>Admin dashboard</h2><button class="ghost-btn" onclick="UI.go('home')">Home</button></div>
  <div id="adminContent"></div>
</section>
<div id="toastStack" class="toast-stack" aria-live="polite"></div>
<div id="compareBar" class="compare-bar hidden"></div>
<div class="quick-actions">
  <button class="quick-fab" title="Top" onclick="UX.scrollTop()">↑</button>
  <button class="quick-fab" title="Theme" onclick="UX.toggleTheme()">◐</button>
</div>
<nav class="nav">
<div class="nav-inner">
<button data-view="home" class="active" onclick="UI.go('home')">⌂<small>Home</small></button>
<button data-view="search" onclick="UI.openSearch()">⌕<small>Search</small></button>
<button data-view="wishlist" onclick="UI.go('wishlist')">♡<small>Wishlist</small></button>
<button data-view="orders" onclick="UI.go('orders')">▣<small>Orders</small></button>
<button data-view="account" onclick="UI.go('account')">◉<small>Account</small></button>
</div>
</nav>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"></div>
<div id="drawer" class="drawer hidden"></div>
</div>
<script>

const App = {
  firebaseReady: false,
  auth: null,
  db: null,
  storage: null,
  user: null,
  products: [],
  categories: [],
  cart: JSON.parse(localStorage.getItem("shopnova_cart") || "[]"),
  wishlist: JSON.parse(localStorage.getItem("shopnova_wishlist") || "[]"),
  unsubscribeOrders: null,
  config: window.__FIREBASE_CONFIG__ || {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  }
};

const Store = {
  saveCart() {
    localStorage.setItem("shopnova_cart", JSON.stringify(App.cart));
    UI.renderCartCount();
  },
  saveWishlist() {
    localStorage.setItem("shopnova_wishlist", JSON.stringify(App.wishlist));
  },
  cartCount() {
    return App.cart.reduce((sum, item) => sum + Number(item.qty || 0), 0);
  },
  cartTotal() {
    return App.cart.reduce((sum, item) => sum + Number(item.price || 0) * Number(item.qty || 0), 0);
  },
  findProduct(id) {
    return App.products.find(p => p.id === id) || null;
  },
  addCart(product, qty = 1) {
    const row = App.cart.find(x => x.id === product.id);
    if (row) {
      row.qty += qty;
    } else {
      App.cart.push({
        id: product.id,
        title: product.title,
        price: Number(product.price || 0),
        mrp: Number(product.mrp || 0),
        image: product.image || "",
        qty
      });
    }
    Store.saveCart();
    UI.toast("Added to cart");
  },
  removeCart(id) {
    App.cart = App.cart.filter(x => x.id !== id);
    Store.saveCart();
    UI.renderCart();
  },
  updateQty(id, qty) {
    const row = App.cart.find(x => x.id === id);
    if (!row) return;
    row.qty = Math.max(1, Number(qty) || 1);
    Store.saveCart();
    UI.renderCart();
  },
  toggleWishlist(id) {
    const exists = App.wishlist.includes(id);
    App.wishlist = exists ? App.wishlist.filter(x => x !== id) : [...App.wishlist, id];
    Store.saveWishlist();
    UI.renderProducts(App.products, "products");
    UI.renderWishlist();
    UI.toast(exists ? "Removed from wishlist" : "Saved to wishlist");
  }
};

const API = {
  async request(path, options = {}) {
    const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
    if (App.auth && App.user) {
      const token = await App.user.getIdToken(false);
      headers.Authorization = "Bearer " + token;
    }
    const apiBase = String(window.__API_BASE_URL__ || "").replace(/\/$/, "");
    const target = /^https?:\/\//i.test(path) ? path : (apiBase + path);
    const response = await fetch(target, { ...options, headers });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = body.error || body.message || `Request failed (${response.status})`;
      throw new Error(message);
    }
    return body;
  },
  products() {
    return API.request("/api/products");
  },
  createOrder(payload) {
    return API.request("/api/orders", { method: "POST", body: JSON.stringify(payload) });
  },
  verifyAdmin(code) {
    return API.request("/api/admin/switch", { method: "POST", body: JSON.stringify({ code }) });
  },
  async uploadImage(file) {
    if (!App.storage || !App.user) throw new Error("Sign in required for image upload");
    const path = `products/${App.user.uid}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
    const ref = App.storage.ref().child(path);
    await ref.put(file, { contentType: file.type || "image/jpeg" });
    return ref.getDownloadURL();
  }
};

const UI = {
  toastTimer: null,
  toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
  },
  showModal(html) {
    const el = document.getElementById("modal");
    el.innerHTML = `<div class="modal-panel">${html}</div>`;
    el.classList.remove("hidden");
    el.onclick = event => {
      if (event.target === el) UI.closeModal();
    };
  },
  closeModal() {
    document.getElementById("modal").classList.add("hidden");
    document.getElementById("modal").innerHTML = "";
  },
  showDrawer(html) {
    const el = document.getElementById("drawer");
    el.innerHTML = `<div class="drawer-panel">${html}</div>`;
    el.classList.remove("hidden");
    el.onclick = event => {
      if (event.target === el) UI.closeDrawer();
    };
  },
  closeDrawer() {
    document.getElementById("drawer").classList.add("hidden");
    document.getElementById("drawer").innerHTML = "";
  },
  escape(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  },
  formatMoney(value) {
    return "₹" + Number(value || 0).toLocaleString("en-IN", {
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    });
  },
  renderCartCount() {
    document.getElementById("cartCount").textContent = Store.cartCount();
  },
  renderCategories() {
    const host = document.getElementById("categories");
    const cats = App.categories.length ? App.categories : ["All", "Electronics", "Fashion", "Home", "Beauty", "Grocery", "Sports"];
    host.innerHTML = cats.map(c => `
      <button class="category" onclick='UI.filterCategory(${JSON.stringify(c)})'>
        <div style="font-size:26px">${UI.categoryIcon(c)}</div>
        <strong>${UI.escape(c)}</strong>
      </button>
    `).join("");
  },
  categoryIcon(category) {
    const map = {
      All: "✦",
      Electronics: "⌁",
      Fashion: "◈",
      Home: "⌂",
      Beauty: "✿",
      Grocery: "◉",
      Sports: "⚡",
      Accessories: "◆"
    };
    return map[category] || "•";
  },
  productCard(p) {
    const wish = App.wishlist.includes(p.id);
    const discount = p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
    return `
      <article class="card">
        <img class="product-image" loading="lazy" src="${UI.escape(p.image || "https://placehold.co/700x700/png?text=ShopNova")}" alt="${UI.escape(p.title)}">
        <div class="card-body">
          <div class="card-title">${UI.escape(p.title)}</div>
          <div class="row space" style="margin-top:5px">
            <span class="rating">★ ${Number(p.rating || 4.2).toFixed(1)}</span>
            <button class="ghost-btn" style="min-height:34px;padding:6px 9px" onclick="Store.toggleWishlist('${UI.escape(p.id)}')">${wish ? "♥" : "♡"}</button>
          </div>
          <div class="price-line">
            <span class="price">${UI.formatMoney(p.price)}</span>
            ${p.mrp ? `<span class="mrp">${UI.formatMoney(p.mrp)}</span>` : ""}
            ${discount ? `<span class="discount">${discount}% off</span>` : ""}
          </div>
          <div class="muted" style="font-size:11px;margin-top:5px">${UI.escape(p.category || "General")} · ${Number(p.stock || 0) > 0 ? "In stock" : "Out of stock"}</div>
          <div class="card-actions">
            <button class="ghost-btn" onclick="UI.openProduct('${UI.escape(p.id)}')">View</button>
            <button class="primary-btn" ${Number(p.stock || 0) <= 0 ? "disabled" : ""} onclick="Store.addCart(Store.findProduct('${UI.escape(p.id)}'),1)">Add</button>
          </div>
        </div>
      </article>
    `;
  },
  renderProducts(list, target = "products") {
    const host = document.getElementById(target);
    if (!host) return;
    if (!list.length) {
      host.innerHTML = `<div class="empty" style="grid-column:1/-1">No products found.</div>`;
      return;
    }
    host.innerHTML = list.map(UI.productCard).join("");
    if (target === "products") {
      document.getElementById("productMeta").textContent = `${list.length} items`;
    }
  },
  renderWishlist() {
    const list = App.wishlist.map(id => Store.findProduct(id)).filter(Boolean);
    UI.renderProducts(list, "wishlistList");
  },
  openProduct(id) {
    const p = Store.findProduct(id);
    if (!p) return;
    const discount = p.mrp > p.price ? Math.round((1 - p.price / p.mrp) * 100) : 0;
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row">
          <strong>Product details</strong>
          <button class="ghost-btn" onclick="UI.closeModal()">Close</button>
        </div>
        <div class="detail-grid" style="margin-top:14px">
          <div>
            <img src="${UI.escape(p.image || "https://placehold.co/900x900/png?text=ShopNova")}" alt="${UI.escape(p.title)}">
          </div>
          <div class="stack">
            <h2 style="margin:0">${UI.escape(p.title)}</h2>
            <div class="rating">★ ${Number(p.rating || 4.2).toFixed(1)} · ${Number(p.ratingCount || 0)} ratings</div>
            <div class="price-line">
              <span class="price" style="font-size:26px">${UI.formatMoney(p.price)}</span>
              ${p.mrp ? `<span class="mrp">${UI.formatMoney(p.mrp)}</span>` : ""}
              ${discount ? `<span class="discount">${discount}% off</span>` : ""}
            </div>
            <div class="muted">${UI.escape(p.description || "Quality product from ShopNova seller.")}</div>
            <div class="info-grid">
              <div class="info-item"><small>Category</small>${UI.escape(p.category || "General")}</div>
              <div class="info-item"><small>Stock</small>${Number(p.stock || 0)}</div>
              <div class="info-item"><small>Seller</small>${UI.escape(p.sellerName || "ShopNova Seller")}</div>
              <div class="info-item"><small>Delivery</small>Fast delivery</div>
            </div>
            <button class="primary-btn w-100" ${Number(p.stock || 0) <= 0 ? "disabled" : ""} onclick="Store.addCart(Store.findProduct('${UI.escape(p.id)}'),1);UI.closeModal()">Add to cart</button>
            <button class="ghost-btn w-100" onclick="Store.toggleWishlist('${UI.escape(p.id)}')">${App.wishlist.includes(p.id) ? "Remove from wishlist" : "Save to wishlist"}</button>
          </div>
        </div>
      </div>
    `);
  },
  openCart() {
    const rows = App.cart;
    const subtotal = Store.cartTotal();
    UI.showDrawer(`
      <div class="panel-pad">
        <div class="close-row">
          <h2 style="margin:0">Your cart</h2>
          <button class="ghost-btn" onclick="UI.closeDrawer()">Close</button>
        </div>
        <div style="margin-top:14px">
        ${rows.length ? rows.map(row => `
          <div class="order-card">
            <div class="row">
              <img src="${UI.escape(row.image || "https://placehold.co/120x120/png?text=Item")}" style="width:64px;height:64px;border-radius:12px;object-fit:cover" alt="">
              <div style="flex:1">
                <strong>${UI.escape(row.title)}</strong>
                <div class="muted">${UI.formatMoney(row.price)} each</div>
                <div class="row" style="margin-top:6px">
                  <button class="ghost-btn" style="min-height:34px;padding:6px 11px" onclick="Store.updateQty('${UI.escape(row.id)}',${row.qty - 1})">−</button>
                  <span>${row.qty}</span>
                  <button class="ghost-btn" style="min-height:34px;padding:6px 11px" onclick="Store.updateQty('${UI.escape(row.id)}',${row.qty + 1})">+</button>
                  <button class="danger-btn" style="min-height:34px;padding:6px 10px;margin-left:auto" onclick="Store.removeCart('${UI.escape(row.id)}')">Remove</button>
                </div>
              </div>
            </div>
          </div>
        `).join("") : `<div class="empty">Your cart is empty.</div>`}
        </div>
        <hr class="sep">
        <div class="row space"><span class="muted">Subtotal</span><strong>${UI.formatMoney(subtotal)}</strong></div>
        <div class="row space" style="margin-top:8px"><span class="muted">Delivery</span><span>Calculated at checkout</span></div>
        <button class="primary-btn w-100" style="margin-top:14px" ${rows.length ? "" : "disabled"} onclick="UI.openCheckout()">Checkout</button>
      </div>
    `);
  },
  openCheckout() {
    if (!App.user) {
      UI.showAuth();
      return;
    }
    Coupons.applied = null;
    const subtotal = Store.cartTotal();
    const savedAddresses = Addresses.all();
    const addressPicker = savedAddresses.length ? `
      <div class="field">
        <label>Saved address</label>
        <select id="checkoutAddressPick" onchange="UI.fillCheckoutAddress(this.value)">
          <option value="">Enter a new address below</option>
          ${savedAddresses.map(a => `<option value="${UI.escape(a.id)}" ${a.isDefault ? "selected" : ""}>${UI.escape(a.label)} — ${UI.escape(a.name)}</option>`).join("")}
        </select>
      </div>` : "";
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row"><h2 style="margin:0">Checkout</h2><button class="ghost-btn" onclick="UI.closeModal()">Close</button></div>
        <div class="status ok" style="margin-top:12px">Signed in as ${UI.escape(App.user.email || App.user.displayName || "customer")}</div>
        <form id="checkoutForm" class="form-grid" style="margin-top:12px">
          ${addressPicker}
          <div class="field"><label>Full name</label><input name="name" id="checkoutName" required autocomplete="name"></div>
          <div class="field"><label>Phone</label><input name="phone" id="checkoutPhone" required inputmode="tel" autocomplete="tel"></div>
          <div class="field"><label>Address</label><textarea name="address" id="checkoutAddress" rows="3" required autocomplete="street-address"></textarea></div>
          <div class="field">
            <label>Coupon code</label>
            <div class="coupon-row">
              <input id="couponInput" placeholder="Try SAVE10, FLAT200 or WELCOME50" autocomplete="off">
              <button class="ghost-btn" type="button" onclick="Coupons.apply(document.getElementById('couponInput').value)">Apply</button>
            </div>
            <div id="couponStatus" class="status hidden" style="margin-top:8px"></div>
          </div>
          <div class="info-item">
            <small>Order total</small>
            <div class="row space"><span class="muted">Subtotal</span><span id="checkoutSubtotal">${UI.formatMoney(subtotal)}</span></div>
            <div id="checkoutDiscountRow" class="row space hidden"><span class="muted">Discount</span><span id="checkoutDiscount" class="discount-line"></span></div>
            <div class="row space" style="margin-top:4px"><strong>Total</strong><strong id="checkoutTotal" style="font-size:22px">${UI.formatMoney(subtotal)}</strong></div>
          </div>
          <button class="primary-btn" type="submit">Place order request</button>
        </form>
        <div class="muted" style="font-size:11px;margin-top:9px">Payment gateway integration is intentionally server-side; this client never trusts a payment success response from the browser.</div>
      </div>
    `);
    if (savedAddresses.length) {
      const def = savedAddresses.find(a => a.isDefault) || savedAddresses[0];
      UI.fillCheckoutAddress(def.id);
    }
    document.getElementById("checkoutForm").onsubmit = async event => {
      event.preventDefault();
      const fd = new FormData(event.currentTarget);
      const finalTotal = Math.max(0, subtotal - (Coupons.applied ? Coupons.applied.discount : 0));
      const payload = {
        items: App.cart.map(x => ({ id: x.id, qty: x.qty })),
        customer: {
          name: fd.get("name"),
          phone: fd.get("phone"),
          address: fd.get("address")
        },
        coupon: Coupons.applied ? Coupons.applied.code : null,
        discount: Coupons.applied ? Coupons.applied.discount : 0,
        total: finalTotal
      };
      try {
        const result = await API.createOrder(payload);
        UI.closeModal();
        UI.closeDrawer();
        App.cart = [];
        Store.saveCart();
        localStorage.setItem("shopnova_order_count", String(Number(localStorage.getItem("shopnova_order_count") || 0) + 1));
        Coupons.applied = null;
        UI.toast(`Order ${result.orderId} created`);
        UI.go("orders");
      } catch (error) {
        UI.toast(error.message);
      }
    };
  },
  fillCheckoutAddress(addressId) {
    const addr = Addresses.all().find(a => a.id === addressId);
    if (!addr) return;
    const nameEl = document.getElementById("checkoutName");
    const phoneEl = document.getElementById("checkoutPhone");
    const addressEl = document.getElementById("checkoutAddress");
    if (nameEl) nameEl.value = addr.name;
    if (phoneEl) phoneEl.value = addr.phone;
    if (addressEl) addressEl.value = addr.address;
  },
  updateCheckoutTotal() {
    const subtotal = Store.cartTotal();
    const discount = Coupons.applied ? Coupons.applied.discount : 0;
    const total = Math.max(0, subtotal - discount);
    const subtotalEl = document.getElementById("checkoutSubtotal");
    const totalEl = document.getElementById("checkoutTotal");
    const discountRow = document.getElementById("checkoutDiscountRow");
    const discountEl = document.getElementById("checkoutDiscount");
    if (subtotalEl) subtotalEl.textContent = UI.formatMoney(subtotal);
    if (totalEl) totalEl.textContent = UI.formatMoney(total);
    if (discountRow) discountRow.classList.toggle("hidden", !discount);
    if (discountEl) discountEl.textContent = "-" + UI.formatMoney(discount);
  },
  showAuth() {
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row"><h2 style="margin:0">Sign in</h2><button class="ghost-btn" onclick="UI.closeModal()">Close</button></div>
        <div class="status" style="margin-top:12px">Use Firebase Authentication. Email/password is handled directly by Firebase.</div>
        <form id="authForm" class="form-grid" style="margin-top:12px">
          <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email"></div>
          <div class="field"><label>Password</label><input name="password" type="password" minlength="6" required autocomplete="current-password"></div>
          <div class="row">
            <button class="primary-btn" type="submit">Sign in</button>
            <button class="ghost-btn" type="button" onclick="Auth.signUpFromForm()">Create account</button>
          </div>
        </form>
        <button class="ghost-btn w-100" style="margin-top:8px" onclick="Auth.google()">Continue with Google</button>
        <div id="authError" class="status error hidden" style="margin-top:10px"></div>
      </div>
    `);
    document.getElementById("authForm").onsubmit = async event => {
      event.preventDefault();
      const fd = new FormData(event.currentTarget);
      try {
        await Auth.signIn(String(fd.get("email")), String(fd.get("password")));
        UI.closeModal();
        UI.go("account");
      } catch (e) {
        UI.showAuthError(e.message);
      }
    };
  },
  showAuthError(msg) {
    const el = document.getElementById("authError");
    if (!el) return;
    el.textContent = msg;
    el.classList.remove("hidden");
  },
  openAccount() {
    UI.go("account");
  },
  filterCategory(category) {
    const list = category === "All"
      ? App.products
      : App.products.filter(p => String(p.category || "").toLowerCase() === String(category).toLowerCase());
    UI.go("home");
    UI.renderProducts(list, "products");
  },
  search(query) {
    const q = String(query || "").trim().toLowerCase();
    if (!q) {
      UI.go("home");
      UI.renderProducts(App.products, "products");
      return;
    }
    const list = App.products.filter(p =>
      [p.title,p.category,p.sellerName,p.description].join(" ").toLowerCase().includes(q)
    );
    UI.renderProducts(list, "searchResults");
    UI.go("search");
  },
  openSearch() {
    const input = document.getElementById("searchInput");
    input.focus();
    if (input.value.trim()) UI.search(input.value);
  },
  renderOrders(orders) {
    App.orders = orders;
    const host = document.getElementById("ordersList");
    if (!orders.length) {
      host.innerHTML = `<div class="empty">No orders yet. Your orders will appear here after checkout.</div>`;
      return;
    }
    host.innerHTML = orders.map(order => `
      <article class="order-card">
        <div class="order-top">
          <div><strong>${UI.escape(order.id)}</strong><div class="muted">${new Date(order.createdAt || Date.now()).toLocaleString("en-IN")}</div></div>
          <span class="badge">${UI.escape(order.status || "created")}</span>
        </div>
        <hr class="sep">
        <div class="row space"><span class="muted">Items</span><span>${Number(order.itemCount || 0)}</span></div>
        <div class="row space" style="margin-top:6px"><span class="muted">Total</span><strong>${UI.formatMoney(order.total)}</strong></div>
        <button class="ghost-btn w-100" style="margin-top:10px" onclick="UI.openOrderTracking('${UI.escape(order.id)}')">Track order</button>
      </article>
    `).join("");
  },
  openOrderTracking(orderId) {
    const order = (App.orders || []).find(o => o.id === orderId);
    if (!order) return;
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row"><h2 style="margin:0">Track order</h2><button class="ghost-btn" onclick="UI.closeModal()">Close</button></div>
        <div class="muted" style="margin-top:6px">Order ${UI.escape(order.id)}</div>
        ${Orders.timelineHtml(order.status)}
      </div>
    `);
  },
  renderAccount() {
    const host = document.getElementById("accountPanel");
    if (!App.user) {
      host.innerHTML = `
        <div class="empty">
          <h3 style="margin-top:0;color:#fff">Welcome to ShopNova</h3>
          <p>Sign in to sync your orders, reviews, saved addresses and wishlist.</p>
          <button class="primary-btn" onclick="UI.showAuth()">Sign in / Create account</button>
        </div>
      `;
      return;
    }
    host.innerHTML = `
      <div class="order-card">
        <div class="row space">
          <div>
            <strong>${UI.escape(App.user.displayName || "ShopNova Customer")}</strong>
            <div class="muted">${UI.escape(App.user.email || "")}</div>
          </div>
          <span class="badge">Authenticated</span>
        </div>
      </div>
      <div class="stack">
        <button class="ghost-btn w-100" onclick="UI.go('orders')">My orders</button>
        <button class="ghost-btn w-100" onclick="UI.go('wishlist')">Wishlist (${App.wishlist.length})</button>
        <button class="ghost-btn w-100" onclick="Admin.openSwitch()">Admin switch</button>
        ${sessionStorage.getItem("shopnova_admin_session") ? `<button class="ghost-btn w-100" onclick="UI.go('admin')">Admin dashboard</button>` : ""}
        <button class="danger-btn w-100" onclick="Auth.signOut()">Sign out</button>
      </div>
    `;
  },
  go(view) {
    const ids = ["home","search","orders","wishlist","account"];
    ids.forEach(x => {
      const el = document.getElementById(`${x}View`);
      if (el) el.classList.toggle("hidden", x !== view);
    });
    document.querySelectorAll(".nav button").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === view);
    });
    if (view === "wishlist") UI.renderWishlist();
    if (view === "account") UI.renderAccount();
    if (view === "orders") Orders.ensure();

const Orders = {
  STATUS_STEPS: [
    { key: "placed", label: "Order placed", note: "We received your order" },
    { key: "confirmed", label: "Confirmed", note: "Seller confirmed your order" },
    { key: "shipped", label: "Shipped", note: "Your package has left the warehouse" },
    { key: "out_for_delivery", label: "Out for delivery", note: "Arriving today" },
    { key: "delivered", label: "Delivered", note: "Package delivered" }
  ],
  normalizeStatus(status) {
    const s = String(status || "created").toLowerCase().replace(/\s+/g, "_");
    if (s === "created" || s === "pending") return "placed";
    if (s === "cancelled" || s === "canceled") return "cancelled";
    const known = Orders.STATUS_STEPS.map(x => x.key);
    return known.includes(s) ? s : "placed";
  },
  timelineHtml(status) {
    const normalized = Orders.normalizeStatus(status);
    if (normalized === "cancelled") {
      return `<div class="status error" style="margin-top:12px">This order was cancelled.</div>`;
    }
    const currentIndex = Orders.STATUS_STEPS.findIndex(s => s.key === normalized);
    return `<div class="timeline">${Orders.STATUS_STEPS.map((step, i) => {
      const state = i < currentIndex ? "done" : (i === currentIndex ? "current" : "");
      return `
        <div class="timeline-step ${state}">
          <div class="timeline-dot"></div>
          <div class="timeline-label">${UI.escape(step.label)}<small>${UI.escape(step.note)}</small></div>
        </div>
      `;
    }).join("")}</div>`;
  },
  ensure() {
    if (!App.user) {
      UI.renderOrders([]);
      return;
    }
    Orders.listen();
  },
  listen() {
    if (!App.db || !App.user) return;
    if (App.unsubscribeOrders) App.unsubscribeOrders();
    App.unsubscribeOrders = App.db.collection("orders")
      .where("userId","==",App.user.uid)
      .orderBy("createdAt","desc")
      .limit(50)
      .onSnapshot(
        snapshot => {
          const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          UI.renderOrders(orders);
        },
        error => {
          console.warn("orders listener", error);
          UI.renderOrders([]);
        }
      );
  }
};

// Add client-side product intelligence without changing server data.
UX.sortProducts = function(products, mode) {
  const list=[...(products||[])];
  if(mode === "price-low") return list.sort((a,b)=>(+a.price||0)-(+b.price||0));
  if(mode === "price-high") return list.sort((a,b)=>(+b.price||0)-(+a.price||0));
  if(mode === "rating") return list.sort((a,b)=>(+b.rating||0)-(+a.rating||0));
  if(mode === "newest") return list.sort((a,b)=>String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  return list;
};

// ===== Filters & sorting toolbar =====
const Filters = {
  state: { sort: "featured", rating: 0, inStock: false, minPrice: "", maxPrice: "" },
  _base: {},
  init() {
    try { Object.assign(this.state, JSON.parse(localStorage.getItem("shopnova_filters") || "{}")); } catch (_) {}
    UX.state.sort = this.state.sort;
  },
  persist() { try { localStorage.setItem("shopnova_filters", JSON.stringify(this.state)); } catch (_) {} },
  apply(list) {
    let out = [...(list || [])];
    if (this.state.rating > 0) out = out.filter(p => Number(p.rating || 0) >= this.state.rating);
    if (this.state.inStock) out = out.filter(p => Number(p.stock || 0) > 0);
    if (this.state.minPrice !== "") out = out.filter(p => Number(p.price || 0) >= Number(this.state.minPrice));
    if (this.state.maxPrice !== "") out = out.filter(p => Number(p.price || 0) <= Number(this.state.maxPrice));
    return UX.sortProducts(out, this.state.sort);
  },
  toolbarHtml(targetId) {
    const hasFilters = this.state.rating || this.state.inStock || this.state.minPrice !== "" || this.state.maxPrice !== "";
    return `
      <select onchange="Filters.setSort(this.value,'${targetId}')">

        <option value="newest" ${this.state.sort === "newest" ? "selected" : ""}>Newest</option>

      <button class="chip ${this.state.rating === 4 ? "active" : ""}" onclick="Filters.toggleRating(4,'${targetId}')">4★ & up</button>

      <input type="number" placeholder="Max ₹" value="${this.state.maxPrice}" onchange="Filters.setPrice('maxPrice',this.value,'${targetId}')">
      ${hasFilters ? `<button class="chip" onclick="Filters.reset('${targetId}')">Clear</button>` : ""}
    `;
  },
  renderToolbars() {
    const home = document.getElementById("homeFilterToolbar");
    const search = document.getElementById("searchFilterToolbar");
    if (home) home.innerHTML = this.toolbarHtml("products");
    if (search) search.innerHTML = this.toolbarHtml("searchResults");
  },
  setSort(value, targetId) { this.state.sort = value; UX.state.sort = value; this.persist(); this.refresh(targetId); },
  toggleRating(value, targetId) { this.state.rating = this.state.rating === value ? 0 : value; this.persist(); this.renderToolbars(); this.refresh(targetId); },
  toggleStock(targetId) { this.state.inStock = !this.state.inStock; this.persist(); this.renderToolbars(); this.refresh(targetId); },
  setPrice(key, value, targetId) { this.state[key] = value; this.persist(); this.refresh(targetId); },
  reset(targetId) { this.state = { sort: this.state.sort, rating: 0, inStock: false, minPrice: "", maxPrice: "" }; this.persist(); this.renderToolbars(); this.refresh(targetId); },
  refresh(targetId) {
    __renderProductsOriginal(this.apply(this._base[targetId] || []), targetId);
  }
};

// ===== Reviews & ratings =====
const Reviews = {
  key: "shopnova_reviews",
  picked: {},
  all() {
    try { return JSON.parse(localStorage.getItem(this.key) || "{}"); } catch (_) { return {}; }
  },
  save(data) { localStorage.setItem(this.key, JSON.stringify(data)); },
  forProduct(id) { return this.all()[id] || []; },
  add(id, rating, comment, author) {
    const data = this.all();
    if (!data[id]) data[id] = [];
    data[id].unshift({
      id: "r" + Date.now(),
      rating: Math.max(1, Math.min(5, Number(rating) || 5)),
      comment: String(comment || "").slice(0, 600),
      author: author || "Guest",
      date: new Date().toISOString()
    });
    this.save(data);
  },
  summary(product) {
    const list = this.forProduct(product.id);
    const baseCount = Number(product.ratingCount || 0);
    const baseRating = Number(product.rating || 0);
    const totalCount = baseCount + list.length;
    if (!totalCount) return { avg: 0, count: 0, breakdown: [0, 0, 0, 0, 0] };
    const addedSum = list.reduce((s, r) => s + r.rating, 0);
    const avg = (baseRating * baseCount + addedSum) / totalCount;
    const breakdown = [0, 0, 0, 0, 0];
    list.forEach(r => { breakdown[r.rating - 1] += 1; });
    return { avg, count: totalCount, breakdown };
  },
  renderSection(product) {
    const summary = this.summary(product);
    const list = this.forProduct(product.id);
    const maxBucket = Math.max(1, ...summary.breakdown);
    const breakdownHtml = [5, 4, 3, 2, 1].map(star => {
      const count = summary.breakdown[star - 1];
      const pct = Math.round((count / maxBucket) * 100);
      return `<span>${star}★</span><div class="rating-bar"><i style="width:${pct}%"></i></div><span class="muted">${count}</span>`;
    }).join("");
    const reviewsHtml = list.length ? list.map(r => `
        <div class="review-item">
          <div class="row space"><strong>${UI.escape(r.author)}</strong><span class="review-stars">${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span></div>
          <div class="muted" style="font-size:11px">${new Date(r.date).toLocaleDateString("en-IN")}</div>
          ${r.comment ? `<div style="margin-top:4px">${UI.escape(r.comment)}</div>` : ""}
        </div>
      `).join("") : `<div class="empty">No reviews yet. Be the first to review this product.</div>`;
    return `
      <hr class="sep">
      <div class="row space"><h3 style="margin:0">Ratings & reviews</h3><strong>★ ${summary.avg.toFixed(1)} · ${summary.count} ratings</strong></div>
      <div class="rating-breakdown">${breakdownHtml}</div>
      <div class="star-input" data-product="${UI.escape(product.id)}">
        ${[1, 2, 3, 4, 5].map(n => `<span data-star="${n}" onclick="Reviews.pickStar('${UI.escape(product.id)}',${n})">★</span>`).join("")}
      </div>
      <textarea id="reviewText-${UI.escape(product.id)}" rows="2" placeholder="Share your experience (optional)" style="width:100%;margin-top:8px;border:1px solid var(--line);background:#0d1628;color:var(--text);border-radius:12px;padding:10px"></textarea>
      <button class="ghost-btn w-100" style="margin-top:8px" onclick="Reviews.submit('${UI.escape(product.id)}')">Submit review</button>
      <div style="margin-top:12px">${reviewsHtml}</div>
    `;
  },
  pickStar(productId, star) {
    this.picked[productId] = star;
    const wrap = document.querySelector(`[data-product="${CSS.escape(productId)}"]`);
    if (!wrap) return;
    wrap.querySelectorAll("span").forEach(el => el.classList.toggle("on", Number(el.dataset.star) <= star));
  },
  submit(productId) {
    const rating = this.picked[productId] || 5;
    const text = document.getElementById(`reviewText-${productId}`)?.value || "";
    const author = App.user ? (App.user.displayName || App.user.email || "You") : "Guest";
    this.add(productId, rating, text, author);
    this.picked[productId] = 0;
    UI.toast("Review submitted");
    UI.openProduct(productId);
  }
};

const Coupons = {
  applied: null,
  codes: {
    SAVE10: { type: "percent", value: 10, label: "10% off applied" },
    FLAT200: { type: "flat", value: 200, label: "₹200 off applied" },
    WELCOME50: { type: "percent", value: 50, label: "50% off applied (first order)", firstOrderOnly: true }
  },
  evaluate(codeRaw, subtotal) {
    const code = String(codeRaw || "").trim().toUpperCase();
    const rule = this.codes[code];
    if (!code) return { valid: false, message: "Enter a coupon code" };
    if (!rule) return { valid: false, message: "Invalid coupon code" };
    if (rule.firstOrderOnly && Number(localStorage.getItem("shopnova_order_count") || 0) > 0) {
      return { valid: false, message: "This code is only valid on your first order" };
    }
    const discount = rule.type === "percent" ? Math.round(subtotal * rule.value / 100) : Math.min(rule.value, subtotal);
    return { valid: true, code, discount, message: rule.label };
  },
  apply(codeInput) {
    const subtotal = Store.cartTotal();
    const result = this.evaluate(codeInput, subtotal);
    const status = document.getElementById("couponStatus");
    if (status) {
      status.textContent = result.message;
      status.className = "status " + (result.valid ? "ok" : "error");
      status.classList.remove("hidden");
    }
    this.applied = result.valid ? result : null;
    UI.updateCheckoutTotal();
    return result;
  }
};

const Addresses = {
  key: "shopnova_addresses",
  all() { try { return JSON.parse(localStorage.getItem(this.key) || "[]"); } catch (_) { return []; } },
  save(list) { localStorage.setItem(this.key, JSON.stringify(list)); },
  add(entry) {
    const list = this.all();
    if (entry.isDefault) list.forEach(a => { a.isDefault = false; });
    list.push({ id: "a" + Date.now(), isDefault: list.length === 0, ...entry });
    this.save(list);
  },
  remove(id) {
    this.save(this.all().filter(a => a.id !== id));
  },
  setDefault(id) {
    const list = this.all();
    list.forEach(a => { a.isDefault = a.id === id; });
    this.save(list);
  }
};

const PaymentMethods = {
  key: "shopnova_payment_methods",
  all() { try { return JSON.parse(localStorage.getItem(this.key) || "[]"); } catch (_) { return []; } },
  save(list) { localStorage.setItem(this.key, JSON.stringify(list)); },
  add(entry) {
    const list = this.all();
    list.push({ id: "pm" + Date.now(), ...entry });
    this.save(list);
  },
  remove(id) { this.save(this.all().filter(p => p.id !== id)); }
};

// ===== Admin dashboard =====
const AdminStore = {
  key: "shopnova_admin_products",
  state() {
    try { return Object.assign({ added: [], edited: {}, deleted: [] }, JSON.parse(localStorage.getItem(this.key) || "{}")); }
    catch (_) { return { added: [], edited: {}, deleted: [] }; }
  },
  save(state) { localStorage.setItem(this.key, JSON.stringify(state)); },
  mergeInto(products) {
    const state = this.state();
    let merged = products.filter(p => !state.deleted.includes(p.id));
    merged = merged.map(p => (state.edited[p.id] ? { ...p, ...state.edited[p.id] } : p));
    return [...merged, ...state.added];
  },
  addProduct(product) {
    const state = this.state();
    state.added.push({ id: "local" + Date.now(), rating: 4.2, ratingCount: 0, ...product });
    this.save(state);
  },
  editProduct(id, fields) {
    const state = this.state();
    const addedIndex = state.added.findIndex(p => p.id === id);
    if (addedIndex >= 0) { state.added[addedIndex] = { ...state.added[addedIndex], ...fields }; }
    else { state.edited[id] = { ...(state.edited[id] || {}), ...fields }; }
    this.save(state);
  },
  deleteProduct(id) {
    const state = this.state();
    if (state.added.some(p => p.id === id)) { state.added = state.added.filter(p => p.id !== id); }
    else if (!state.deleted.includes(id)) { state.deleted.push(id); }
    this.save(state);
  }
};

const __productsLoadOriginal = Products.load.bind(Products);
Products.load = async function() {
  await __productsLoadOriginal();
  App.products = AdminStore.mergeInto(App.products);
  App.categories = [...new Set(App.products.map(p => p.category).filter(Boolean))];
  UI.renderCategories();
  UI.renderProducts(App.products, "products");
  UI.renderWishlist();
};

const AdminPanel = {
  tab: "products",
  setTab(tab) { this.tab = tab; this.render(); },
  render() {
    const host = document.getElementById("adminContent");
    if (!host) return;
    host.innerHTML = `
      <div class="admin-tabs">
        <button class="chip ${this.tab === "products" ? "active" : ""}" onclick="AdminPanel.setTab('products')">Products</button>
        <button class="chip ${this.tab === "orders" ? "active" : ""}" onclick="AdminPanel.setTab('orders')">Orders</button>
      </div>
      <div id="adminTabBody"></div>
    `;
    if (this.tab === "products") this.renderProducts(); else this.renderOrders();
  },
  renderProducts() {
    const body = document.getElementById("adminTabBody");
    body.innerHTML = `
      <button class="primary-btn" onclick="AdminPanel.openAddProduct()">Add product</button>
      <div class="muted" style="font-size:11px;margin:8px 0">Changes here are stored on this device only, layered on top of the products your API returns — there is no product-write endpoint on the backend yet.</div>
      <div style="overflow:auto">
        <table class="admin-table">
          <tr><th></th><th>Title</th><th>Price</th><th>Stock</th><th>Category</th><th></th></tr>
          ${(App.products || []).map(p => `
            <tr>
              <td><img src="${UI.escape(p.image || "https://placehold.co/80x80/png?text=SN")}" alt=""></td>
              <td>${UI.escape(p.title)}</td>
              <td>${UI.formatMoney(p.price)}</td>
              <td>${Number(p.stock || 0)}</td>
              <td>${UI.escape(p.category || "")}</td>
              <td class="row">
                <button class="ghost-btn" style="min-height:30px;padding:5px 9px" onclick="AdminPanel.openEditProduct('${UI.escape(p.id)}')">Edit</button>
                <button class="danger-btn" style="min-height:30px;padding:5px 9px" onclick="AdminPanel.deleteProduct('${UI.escape(p.id)}')">Delete</button>
              </td>
            </tr>
          `).join("")}
        </table>
      </div>
    `;
  },
  renderOrders() {
    const body = document.getElementById("adminTabBody");
    const orders = App.orders || [];
    body.innerHTML = `
      <div class="muted" style="font-size:11px;margin:8px 0">Showing orders visible to the signed-in admin account. Status updates write directly to Firestore.</div>
      ${orders.length ? orders.map(o => `
        <div class="order-card">
          <div class="order-top"><strong>${UI.escape(o.id)}</strong><span class="badge">${UI.escape(o.status || "created")}</span></div>
          <div class="row space" style="margin-top:6px"><span class="muted">Total</span><strong>${UI.formatMoney(o.total)}</strong></div>
          <select style="margin-top:8px" onchange="AdminPanel.updateOrderStatus('${UI.escape(o.id)}',this.value)">
            ${Orders.STATUS_STEPS.map(s => `<option value="${s.key}" ${Orders.normalizeStatus(o.status) === s.key ? "selected" : ""}>${UI.escape(s.label)}</option>`).join("")}
          </select>
        </div>
      `).join("") : `<div class="empty">No orders to show.</div>`}
    `;
  },
  openAddProduct() {
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row"><h2 style="margin:0">Add product</h2><button class="ghost-btn" onclick="UI.closeModal()">Close</button></div>
        <form id="productForm" class="form-grid" style="margin-top:12px">
          <div class="field"><label>Title</label><input name="title" required></div>
          <div class="field"><label>Price</label><input name="price" type="number" min="0" required></div>
          <div class="field"><label>MRP (optional)</label><input name="mrp" type="number" min="0"></div>
          <div class="field"><label>Category</label><input name="category" required></div>
          <div class="field"><label>Stock</label><input name="stock" type="number" min="0" required></div>
          <div class="field"><label>Image URL</label><input name="image" placeholder="https://..."></div>
          <button class="primary-btn" type="submit">Save product</button>
        </form>
      </div>
    `);
    document.getElementById("productForm").onsubmit = event => {
      event.preventDefault();
      const fd = new FormData(event.currentTarget);
      AdminStore.addProduct({
        title: fd.get("title"), price: Number(fd.get("price")), mrp: Number(fd.get("mrp") || 0),
        category: fd.get("category"), stock: Number(fd.get("stock")), image: fd.get("image") || ""
      });
      UI.closeModal();
      UI.toast("Product added");
      Products.load();
      AdminPanel.render();
    };
  },
  openEditProduct(id) {
    const p = Store.findProduct(id);
    if (!p) return;
    UI.showModal(`
      <div class="panel-pad">
        <div class="close-row"><h2 style="margin:0">Edit product</h2><button class="ghost-btn" onclick="UI.closeModal()">Close</button></div>
        <form id="productEditForm" class="form-grid" style="margin-top:12px">
          <div class="field"><label>Title</label><input name="title" value="${UI.escape(p.title)}" required></div>
          <div class="field"><label>Price</label><input name="price" type="number" min="0" value="${Number(p.price || 0)}" required></div>
          <div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="${Number(p.stock || 0)}" required></div>
          <button class="primary-btn" type="submit">Save changes</button>
        </form>
      </div>
    `);
    document.getElementById("productEditForm").onsubmit = event => {
      event.preventDefault();
      const fd = new FormData(event.currentTarget);
      AdminStore.editProduct(id, { title: fd.get("title"), price: Number(fd.get("price")), stock: Number(fd.get("stock")) });
      UI.closeModal();
      UI.toast("Product updated");
      Products.load();
      AdminPanel.render();
    };
  },
  deleteProduct(id) {
    AdminStore.deleteProduct(id);
    UI.toast("Product removed");
    Products.load();
    AdminPanel.render();
  },
  async updateOrderStatus(orderId, status) {
    try {
      if (!App.db) throw new Error("Firestore is not connected");
      await App.db.collection("orders").doc(orderId).update({ status });
      UI.toast("Order status updated");
    } catch (error) {
      UI.toast(error.message);
    }
  }
};

const __goForAdmin = UI.go.bind(UI);
UI.go = function(view) {
  const adminSection = document.getElementById("adminView");
  if (view === "admin") {
    ["homeView", "searchView", "ordersView", "wishlistView", "accountView"].forEach(id => document.getElementById(id)?.classList.add("hidden"));
    document.getElementById("experienceView")?.classList.add("hidden");
    adminSection?.classList.remove("hidden");
    document.querySelectorAll(".nav button").forEach(b => b.classList.remove("active"));
    AdminPanel.render();
    return;
  }
  adminSection?.classList.add("hidden");
  return __goForAdmin(view);
};

async function boot() {
  UI.renderCartCount();
  UI.renderCategories();
  UI.renderAccount();
  document.getElementById("searchBtn").addEventListener("click", () => UI.search(document.getElementById("searchInput").value));
  document.getElementById("searchInput").addEventListener("keydown", event => {
    if (event.key === "Enter") UI.search(event.currentTarget.value);
  });
  document.getElementById("cartBtn").addEventListener("click", UI.openCart);
  await Auth.init();
  await Products.load();
}

window.addEventListener("DOMContentLoaded", boot);

</script>
